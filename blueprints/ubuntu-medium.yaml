# ubuntu-medium — single Ubuntu VM, "medium" flavor, static IP.
formatVersion: 1
inputs: {}
resources:
  Cloud_Machine_1:
    type: Cloud.vSphere.Machine
    properties:
      image: ubuntu           # -> image mapping "ubuntu"
      flavor: medium          # -> flavor mapping "medium" (2 vCPU / 4 GB)
      networks:
        - network: '${resource.Cloud_Network_1.id}'
          assignment: static
  Cloud_Network_1:
    type: Cloud.vSphere.Network
    properties:
      networkType: existing
