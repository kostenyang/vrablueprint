# Self-service VM blueprint.
#
# The blueprint does not need to know which custom attributes exist: descriptive
# fields (requester, employee ID, ticket, purpose, ...) arrive as one `attributes`
# object from the request portal, which writes them to vCenter after provisioning.
# Adding or removing an attribute therefore changes only the portal, never this file.
#
# Option sources are tags and mappings in vRA, so adding a cluster, size, OS or
# network zone needs no change here either.

formatVersion: 1

inputs:
  os:
    type: string
    title: Operating System
    description: Name of the vRA image mapping
    default: ubuntu
  size:
    type: string
    title: Size
    description: Name of the vRA flavor mapping
    default: small
  cluster:
    type: string
    title: Cluster
    description: Matches the cluster:<value> tag on the compute
    default: linux-test
  zone:
    type: string
    title: Network Zone
    description: Matches the zone:<value> tag on the NSX VLAN segment (MES / FDC / OA)
    default: oa
  attributes:
    type: object
    title: Custom Attributes
    description: Custom attributes passed in as one object by the request portal
    default: {}

resources:
  Cloud_vSphere_Machine_1:
    type: Cloud.vSphere.Machine
    properties:
      image: ${input.os}
      flavor: ${input.size}
      # One object for every custom attribute -- add fields in the portal, not here.
      attributes: ${input.attributes}
      # Cluster placement, matched against the tag on the compute.
      constraints:
        - tag: cluster:${input.cluster}
      networks:
        - network: ${resource.Cloud_vSphere_Network_1.id}
          assignment: static

  Cloud_vSphere_Network_1:
    type: Cloud.vSphere.Network
    properties:
      # The segments are NSX VLAN segments, created up front, so this is always
      # an existing network. vRA never creates one per request -- on-demand
      # segments require overlay, which this environment does not use.
      networkType: existing
      # Network zone. If no segment carries the tag, allocation fails with an
      # explicit message rather than placing the VM on the wrong network.
      constraints:
        - tag: zone:${input.zone}
